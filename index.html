<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b1026">
  <title>For Anneesa 💗</title>
  <style>
    :root { --pink:#ffb9d3; --ink:#1b1026; --glass:rgba(22,12,32,.55); }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--ink); }
    body { color:#fff; font-family: Georgia, "Times New Roman", serif; }
    #stage { position:fixed; inset:0; overflow:hidden; background:
      radial-gradient(ellipse at 50% 30%, #633657 0%, #2b1838 42%, #110d20 100%); }
    .scene { position:absolute; inset:0; opacity:0; visibility:hidden; transform:scale(1.015);
      transition:opacity .9s ease, transform 1.2s cubic-bezier(.2,.7,.2,1), visibility .9s; }
    .scene.active { opacity:1; visibility:visible; transform:scale(1); }
    .scene.leaving { opacity:0; transform:scale(.985); }
    .scene iframe { display:block; width:100%; height:100%; border:0; background:transparent; }
    /* A subtle visual refresh for the three pages she's already seen:
       each scene gets a new cinematic frame treatment while keeping its original content. */
    #anneesa::after, #anneesaa::after, #valentines::after {
      content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
      opacity:0; transition:opacity 1s ease;
    }
    #anneesa::after {
      opacity:1;
      background:radial-gradient(ellipse at 50% 42%, transparent 38%, rgba(50,12,42,.18) 100%),
        linear-gradient(135deg,rgba(255,190,220,.08),transparent 45%,rgba(94,41,105,.12));
      box-shadow:inset 0 0 0 1px rgba(255,225,239,.12);
    }
    #anneesaa::after {
      opacity:1;
      background:radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(17,13,43,.26) 100%),
        linear-gradient(180deg,rgba(120,103,190,.10),transparent 50%,rgba(255,185,211,.08));
      box-shadow:inset 0 0 90px rgba(177,137,255,.10);
    }
    #valentines::after {
      opacity:1;
      background:radial-gradient(ellipse at 50% 45%, transparent 32%, rgba(73,5,31,.20) 100%),
        linear-gradient(135deg,rgba(255,99,151,.08),transparent 55%,rgba(255,205,220,.10));
      box-shadow:inset 0 0 0 1px rgba(255,205,220,.16);
    }
    .scene::before { position:absolute; z-index:3; top:24px; left:50%; transform:translateX(-50%);
      color:rgba(255,239,246,.88); font:500 10px/1.2 system-ui,sans-serif; letter-spacing:.28em;
      text-transform:uppercase; white-space:nowrap; pointer-events:none; text-shadow:0 1px 12px #210d28; }
    #anneesa::before { content:"A little more of us"; }
    #anneesaa::before { content:"For the moments that matter"; }
    #valentines::before { content:"And one more surprise"; }
    .shade { pointer-events:none; position:absolute; inset:0; z-index:2;
      background:linear-gradient(180deg,rgba(10,5,20,.12),transparent 22%,transparent 72%,rgba(10,5,20,.28)); }
    #controls { position:fixed; z-index:5; inset:auto 0 0; display:flex; align-items:center;
      justify-content:space-between; gap:12px; padding:18px clamp(14px,4vw,42px);
      background:linear-gradient(transparent,rgba(12,6,20,.7)); }
    .btn { border:1px solid rgba(255,255,255,.42); color:white; background:var(--glass);
      border-radius:999px; padding:12px 18px; font:600 14px/1.1 system-ui,sans-serif;
      cursor:pointer; backdrop-filter:blur(12px); transition:background .25s, transform .25s; }
    .btn:hover { background:rgba(255,185,211,.24); transform:translateY(-2px); }
    .btn:focus-visible { outline:2px solid var(--pink); outline-offset:3px; }
    #progress { display:flex; gap:7px; align-items:center; justify-content:center; }
    .dot { width:7px; height:7px; padding:0; border:0; border-radius:20px; background:#ffffff70;
      cursor:pointer; transition:width .35s,background .35s; }
    .dot.active { width:24px; background:var(--pink); }
    #chapter { font:500 12px/1.3 system-ui,sans-serif; letter-spacing:.16em; text-transform:uppercase;
      color:#ffe4ef; min-width:100px; text-align:center; }
    #transition { position:fixed; inset:0; z-index:10; display:grid; place-items:center;
      background:#1b1026; opacity:0; visibility:hidden; transition:opacity .45s,visibility .45s; }
    #transition.show { opacity:1; visibility:visible; }
    .heart { color:var(--pink); font-size:clamp(36px,8vw,72px); animation:pulse 1s ease-in-out infinite alternate; }
    @keyframes pulse { from{transform:scale(.92);opacity:.7} to{transform:scale(1.08);opacity:1} }
    #finale { position:fixed; inset:0; z-index:8; display:none; place-items:center; text-align:center;
      padding:28px; background:radial-gradient(ellipse at 50% 40%,#7d345e,#32162f 52%,#120b20);
      overflow:hidden; }
    #finale.show { display:grid; animation:reveal 1.2s ease both; }
    .final-card { position:relative; z-index:2; max-width:720px; }
    .final-card .eyebrow { font:600 12px system-ui,sans-serif; letter-spacing:.28em; text-transform:uppercase; color:#ffd6e5; }
    .final-card h1 { font-size:clamp(42px,8vw,92px); font-weight:400; line-height:.98; margin:20px 0; }
    .final-card p { font-size:clamp(17px,2.6vw,23px); line-height:1.65; color:#ffe9f0; }
    .petals { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
    .petal { position:absolute; top:-12vh; color:#ffc1d8; opacity:.8; animation:fall linear infinite; }
    @keyframes fall { to { transform:translate3d(var(--drift),115vh,0) rotate(680deg); } }
    @keyframes reveal { from{opacity:0;transform:scale(1.025)} to{opacity:1;transform:scale(1)} }
    @media (max-width:520px) {
      #controls { padding:12px; gap:8px; }
      .btn { padding:11px 13px; font-size:12px; }
      #chapter { display:none; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Birthday experience for Anneesa">
    <section class="scene active" id="flower" aria-label="Flower chapter">
      <iframe title="Flower experience" src="https://junedh-shaik.github.io/flower/" allow="autoplay"></iframe>
    </section>
    <section class="scene" id="anneesa" aria-label="Anneesa chapter">
      <iframe title="Anneesa experience" src="https://junedh-shaik.github.io/Anneesa/" loading="lazy" allow="autoplay"></iframe>
    </section>
    <section class="scene" id="anneesaa" aria-label="Anneesaa chapter">
      <iframe title="Anneesaa experience" src="https://junedh-shaik.github.io/anneesaa/" loading="lazy" allow="autoplay"></iframe>
    </section>
    <section class="scene" id="valentines" aria-label="Valentines chapter">
      <iframe title="Valentines experience" src="https://junedh-shaik.github.io/Valentines/" loading="lazy" allow="autoplay"></iframe>
    </section>
    <div class="shade"></div>
  </main>

  <nav id="controls" aria-label="Experience navigation">
    <button class="btn" id="back" type="button">← Back</button>
    <div id="progress" aria-label="Choose a chapter">
      <button class="dot active" aria-label="Chapter 1: Flowers" data-index="0"></button>
      <button class="dot" aria-label="Chapter 2: Anneesa" data-index="1"></button>
      <button class="dot" aria-label="Chapter 3: Anneesaa" data-index="2"></button>
      <button class="dot" aria-label="Chapter 4: Valentines" data-index="3"></button>
    </div>
    <div id="chapter">01 / Flowers</div>
    <button class="btn" id="next" type="button">Continue →</button>
  </nav>

  <div id="transition" aria-hidden="true"><div class="heart">♥</div></div>

  <section id="finale" aria-label="Birthday celebration">
    <div class="petals" id="petals"></div>
    <div class="final-card">
      <div class="eyebrow">A little world made just for you</div>
      <h1>Happy Birthday,<br>Anneesa 💗</h1>
      <p>I hope your day is filled with the same warmth, beauty, and happiness you bring into my world. You deserve all the love today and always.</p>
      <button class="btn" id="replay" type="button">↺ Experience it again</button>
    </div>
  </section>

  <script>
    const names = ["01 / Flowers", "02 / Anneesa", "03 / Anneesaa", "04 / Valentines"];
    const scenes = [...document.querySelectorAll(".scene")];
    const dots = [...document.querySelectorAll(".dot")];
    const transition = document.querySelector("#transition");
    const finale = document.querySelector("#finale");
    const chapter = document.querySelector("#chapter");
    const back = document.querySelector("#back");
    const next = document.querySelector("#next");
    let current = 0, busy = false;

    function updateControls() {
      dots.forEach((dot, i) => dot.classList.toggle("active", i === current));
      chapter.textContent = names[current];
      back.disabled = current === 0;
      back.style.opacity = current === 0 ? ".45" : "1";
      next.textContent = current === scenes.length - 1 ? "Birthday finale ✨" : "Continue →";
    }

    async function goTo(index) {
      if (busy || index < 0 || index >= scenes.length || index === current) return;
      busy = true;
      transition.classList.add("show");
      await new Promise(resolve => setTimeout(resolve, 480));
      scenes[current].classList.remove("active");
      current = index;
      scenes[current].classList.add("active");
      updateControls();
      await new Promise(resolve => setTimeout(resolve, 240));
      transition.classList.remove("show");
      await new Promise(resolve => setTimeout(resolve, 480));
      busy = false;
    }

    function showFinale() {
      finale.classList.add("show");
      document.querySelector("#controls").style.display = "none";
      document.querySelector("#stage").style.visibility = "hidden";
      makePetals();
    }
    function makePetals() {
      const box = document.querySelector("#petals");
      if (box.childElementCount) return;
      const symbols = ["✿", "✧", "♥", "❀"];
      for (let i = 0; i < 32; i++) {
        const p = document.createElement("span");
        p.className = "petal";
        p.textContent = symbols[i % symbols.length];
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = (7 + Math.random() * 9) + "s";
        p.style.animationDelay = (-Math.random() * 12) + "s";
        p.style.setProperty("--drift", (Math.random() * 180 - 90) + "px");
        p.style.fontSize = (12 + Math.random() * 22) + "px";
        box.appendChild(p);
      }
    }
    back.addEventListener("click", () => goTo(current - 1));
    next.addEventListener("click", () => current === scenes.length - 1 ? showFinale() : goTo(current + 1));
    dots.forEach(dot => dot.addEventListener("click", () => goTo(Number(dot.dataset.index))));
    document.querySelector("#replay").addEventListener("click", () => {
      finale.classList.remove("show");
      document.querySelector("#controls").style.display = "flex";
      document.querySelector("#stage").style.visibility = "visible";
      current = 0;
      scenes.forEach((scene, i) => scene.classList.toggle("active", i === 0));
      updateControls();
    });
    document.addEventListener("keydown", e => {
      if (finale.classList.contains("show")) return;
      if (e.key === "ArrowRight") current === scenes.length - 1 ? showFinale() : goTo(current + 1);
      if (e.key === "ArrowLeft") goTo(current - 1);
    });
    updateControls();
  </script>
</body>
</html>
